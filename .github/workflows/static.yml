# A standard template for deploying React on GitHub Actions
jobs:
  # ... other setup steps
  build:
    runs-on: ubuntu-latest
    steps:
      # ... checkout code
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use a recent LTS version

      - name: Install dependencies
        run: npm install 

      - name: Build project
        run: npm run build # This creates the 'build' directory

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build' # Tells the action to deploy the contents of the 'build' folder
# ... deployment step
